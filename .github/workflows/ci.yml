name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@v4
      - name: Build library (with network)
        run: alr -n build
      - name: Build library (BEACON_NETWORK=no, the embedded profile)
        run: BEACON_NETWORK=no alr -n build
      - name: Tests
        run: |
          cd tests
          alr -n build
          ./bin/queue_tests
          ./bin/queue_property_tests
          ./bin/topic_tests
          ./bin/topic_timed_tests
          ./bin/wire_tests
      - name: Jorvik profile and zero-heap check of the core (Task 3.4)
        # Builds src/ (no src/net/, no Beacon.Topic.Timed) and an instance of
        # Beacon.Topic under pragma Profile (Jorvik) with No_Allocators,
        # No_Implicit_Heap_Allocations and No_Secondary_Stack, then runs it.
        run: |
          alr -n exec -- gprbuild -P jorvik/jorvik.gpr
          ./jorvik/bin/jorvik_check
      - name: In-process demo (reliable never drops, best-effort keeps newest)
        run: |
          cd demo
          alr -n build
          ./bin/inproc_demo
      - name: UDP demo, two processes on loopback
        run: |
          cd demo
          ./bin/net_subscriber 239.255.0.1 5000 3 > sub.log &
          sleep 0.5
          ./bin/net_publisher 239.255.0.1 5000 200
          wait
          cat sub.log
          grep -q "done, 200 readings" sub.log
      - name: SPARK proof of Beacon.Queue (flow + proof, every Depth)
        run: |
          alr -n with gnatprove
          alr -n exec -- gnatprove -P prove/prove.gpr -XBEACON_NETWORK=no --mode=all
